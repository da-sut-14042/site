<svg class="flow-graph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" role="img" aria-labelledby="title desc">
  <title id="title">Flow network graph</title>
  <desc id="desc">A directed flow network with nodes s, a, b, c, d, e, t and labeled capacities.</desc>
  <style>
    .flow-graph {
      color: #111827;
      max-width: 100%;
      height: auto;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", sans-serif;
    }
    .edge {
      stroke: currentColor;
      stroke-width: 2.8;
      stroke-linecap: round;
      fill: none;
    }
    .node {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.8;
    }
    .node-text {
      fill: currentColor;
      font-size: 22px;
      font-weight: 500;
      font-style: italic;
      font-family: STIX Two Text, Cambria, Georgia, "Times New Roman", serif;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .edge-label {
      fill: currentColor;
      font-size: 20px;
      font-weight: 700;
      font-family: STIX Two Text, Cambria, Georgia, "Times New Roman", serif;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="currentColor"/>
    </marker>
  </defs>

  <line class="edge" x1="98.561" y1="196.794" x2="200.973" y2="113.584" marker-end="url(#arrow)"/>
  <line class="edge" x1="106.800" y1="220.000" x2="192.600" y2="220.000" marker-end="url(#arrow)"/>
  <line class="edge" x1="98.561" y1="243.206" x2="200.973" y2="326.416" marker-end="url(#arrow)"/>
  <line class="edge" x1="266.003" y1="97.616" x2="453.410" y2="137.260" marker-end="url(#arrow)"/>
  <line class="edge" x1="265.358" y1="209.800" x2="454.065" y2="155.366" marker-end="url(#arrow)"/>
  <line class="edge" x1="265.358" y1="230.200" x2="454.065" y2="284.634" marker-end="url(#arrow)"/>
  <line class="edge" x1="266.003" y1="342.384" x2="453.410" y2="302.740" marker-end="url(#arrow)"/>
  <line class="edge" x1="523.969" y1="159.154" x2="635.477" y2="205.615" marker-end="url(#arrow)"/>
  <line class="edge" x1="523.969" y1="280.846" x2="635.477" y2="234.385" marker-end="url(#arrow)"/>
  <path class="edge" d="M 207.011 118.736 Q 178.000 155.000 206.636 190.796" marker-end="url(#arrow)"/>
  <path class="edge" d="M 252.989 191.264 Q 282.000 155.000 253.364 119.204" marker-end="url(#arrow)"/>
  <path class="edge" d="M 469.032 175.242 Q 438.000 220.000 468.690 264.265" marker-end="url(#arrow)"/>
  <path class="edge" d="M 510.968 264.758 Q 542.000 220.000 511.310 175.735" marker-end="url(#arrow)"/>

  <text class="edge-label" x="139.767" y="137.189">6</text>
  <text class="edge-label" x="149.700" y="202.000">4</text>
  <text class="edge-label" x="139.767" y="302.811">5</text>
  <text class="edge-label" x="359.706" y="99.438">3</text>
  <text class="edge-label" x="351.712" y="162.583">2</text>
  <text class="edge-label" x="351.712" y="277.417">2</text>
  <text class="edge-label" x="359.706" y="340.562">3</text>
  <text class="edge-label" x="587.723" y="162.385">6</text>
  <text class="edge-label" x="587.723" y="277.615">6</text>
  <text class="edge-label" x="168.412" y="154.883">2</text>
  <text class="edge-label" x="291.588" y="155.117">1</text>
  <text class="edge-label" x="429.431" y="219.877">2</text>
  <text class="edge-label" x="550.569" y="220.123">1</text>

  <circle class="node" cx="70" cy="220" r="34"/>
  <text class="node-text" x="70" y="220">s</text>
  <circle class="node" cx="230" cy="90" r="34"/>
  <text class="node-text" x="230" y="90">a</text>
  <circle class="node" cx="230" cy="220" r="34"/>
  <text class="node-text" x="230" y="220">b</text>
  <circle class="node" cx="230" cy="350" r="34"/>
  <text class="node-text" x="230" y="350">c</text>
  <circle class="node" cx="490" cy="145" r="34"/>
  <text class="node-text" x="490" y="145">d</text>
  <circle class="node" cx="490" cy="295" r="34"/>
  <text class="node-text" x="490" y="295">e</text>
  <circle class="node" cx="670" cy="220" r="34"/>
  <text class="node-text" x="670" y="220">t</text>
</svg>
